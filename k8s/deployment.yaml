apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cicd
  namespace: nginx-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-cicd
  template:
    metadata:
      labels:
        app: nginx-cicd
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: nginx
          image: ghcr.io/poane/nginx-cicd:latest
          ports:
            - containerPort: 80
